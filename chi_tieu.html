:root{--bg:#F3EBDD;--sf:#E8DCC6;--ln:#C9B99A;--tx:#3B2F26;--mu:#7A6A58;--ac:#4A5D3A;--on:#F3EBDD;--wr:#9C4A2F;--f:"Source Serif 4",Georgia,"Times New Roman",serif}
@media(prefers-color-scheme:dark){:root{--bg:#1F1914;--sf:#2B231C;--ln:#4A3E32;--tx:#E6DAC4;--mu:#A8997F;--ac:#8FA277;--on:#1F1914;--wr:#C77A5C}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 var(--f);font-variant-numeric:lining-nums tabular-nums}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(150px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
h1{font-size:26px;font-weight:400;margin:0;letter-spacing:-.01em}
.lb{font-style:italic;color:var(--mu);font-size:14.5px}
.hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--ln);padding-bottom:8px;margin-bottom:18px}
.hd button{font-size:28px;padding:0 12px;color:var(--ac);line-height:1}
.big{font-size:52px;line-height:1.05;letter-spacing:-.02em;margin:2px 0 14px}.big.neg{color:var(--wr)}
.big small{font-size:.38em;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:10px 0;margin-bottom:10px;gap:8px}
.st span{display:block;font-size:13px;font-style:italic;color:var(--mu);margin-bottom:2px}
.st strong{font-size:16px;font-weight:600;white-space:nowrap}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--ln);width:100%}
.bar{height:5px;background:var(--sf);margin:10px 0 6px;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.sec{margin:26px 0 6px;font-size:20px;font-weight:600;border-bottom:1px solid var(--ln);padding-bottom:5px;display:flex;justify-content:space-between;align-items:baseline}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln);width:100%}
.r>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r small{display:block;color:var(--mu);font-size:13.5px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .bar{display:block;height:3px;margin:6px 0 0}
.sw{display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:1px}
.pl{color:var(--ac)}.day{margin:18px 0 2px;font-style:italic;color:var(--mu);font-size:14.5px}
.lk{color:var(--ac);text-decoration:underline;text-underline-offset:3px;font-size:14.5px}
.fi{width:100%;padding:10px 12px;margin-bottom:8px;background:var(--sf);border:0;border-bottom:1px solid var(--ln);border-radius:3px 3px 0 0;outline:0;font-size:16px}.fi:focus{border-color:var(--ac)}
.row2{display:flex;gap:8px;margin-bottom:8px}.row2 .fi{margin-bottom:0}.row2 .dt{width:165px;flex-shrink:0;font-size:13.5px;padding:10px 8px}
.pri{width:100%;padding:13px;background:var(--ac);color:var(--on);border-radius:3px;font-weight:600;margin-top:4px;text-align:center}
.pri.alt{background:none;color:var(--wr);border:1px solid var(--wr);margin-top:8px}
.tabs{display:flex;border-bottom:1px solid var(--ln);margin-bottom:6px}.tabs button{flex:1;padding:8px;color:var(--mu);text-align:center}
.tabs .on{color:var(--ac);border-bottom:2px solid var(--ac);font-weight:600}
.amt-box{text-align:right;margin:4px 0 8px}
.expr{font-size:14px;color:var(--mu);min-height:20px;font-style:italic}
.amt{font-size:40px;line-height:1.1;margin:0}
.chips{display:flex;overflow-x:auto;white-space:nowrap;gap:7px;margin-bottom:10px;padding-bottom:3px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--ln);padding:6px 12px;border-radius:3px;font-size:14.5px;flex-shrink:0}
.chips .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.kp button{height:46px;font-size:20px;background:var(--sf);border-radius:3px;text-align:center}
.kp .op{color:var(--ac);font-weight:600}
#sh{position:fixed;inset:0;z-index:20}.bk{position:absolute;inset:0;background:#0008}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:94dvh;overflow:auto;background:var(--bg);padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-radius:10px 10px 0 0;max-width:520px;margin:0 auto}
.pn h2{margin:0 0 12px;font-size:21px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:14px 0;font-size:15px;color:var(--mu);text-align:center;border-top:2px solid transparent;margin-top:-1px}
nav .on{color:var(--ac);border-top-color:var(--ac);font-weight:600}
.fab{position:fixed;right:20px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;background:var(--ac);color:var(--on);font-size:32px;line-height:1;border-radius:4px;z-index:6;text-align:center;box-shadow:0 4px 12px #0004}
#tt{position:fixed;left:16px;right:16px;bottom:calc(142px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:11px 14px;border-radius:3px;z-index:30;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
#tt button{color:inherit;text-decoration:underline;margin-left:10px;font-weight:600}
.bkb{background:var(--sf);border-left:3px solid var(--wr);padding:10px 12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;border-radius:0 3px 3px 0}
.sub{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);font-style:italic;padding:2px 0 8px;border-bottom:1px solid var(--ln)}
.tag{font-size:11.5px;padding:1px 5px;border:1px solid var(--ln);border-radius:2px;margin-left:6px;color:var(--mu);font-style:normal}
</style></head><body>
<main id="app"><div id="v"></div></main>
<button class="fab" data-a="add" aria-label="Thêm khoản">+</button>
<nav><button data-a="go" data-v="home">Tổng quan</button><button data-a="go" data-v="cats">Danh mục</button><button data-a="go" data-v="hist">Lịch sử</button><button data-a="go" data-v="set">Cài đặt</button></nav>
<div id="sh" hidden></div><div id="tt" hidden></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),f=n=>Math.round(n).toLocaleString('vi-VN');
const PAL=['#4A5D3A','#A0674A','#B79B66','#7B5B3F','#9C4A2F','#8A8678','#6B7F5A','#5C4A3A'];
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const pmk=k=>{const[y,m]=k.split('-');return key(new Date(+y,+m-2,1))};
let S;try{S=JSON.parse(localStorage.getItem('cto'))}catch(e){}
S=S||{cats:['Ăn uống','Đi lại','Học tập','Nhà trọ','Giải trí','Mua sắm','Sức khoẻ','Khác'].map((n,i)=>({id:'c'+i,name:n,color:PAL[i]})),tx:[],cap:{},fix:[],ops:0};
S.cap=S.cap||{};S.fix=S.fix||[];S.ops=S.ops||0;
const save=(op=1)=>{if(op)S.ops=(S.ops||0)+1;try{localStorage.setItem('cto',JSON.stringify(S))}catch(e){toast('Không lưu được dữ liệu')}};

let view='home',arg=null,mk=key(new Date()),all=false,q='',fm=null,last=null,pend=null,tmr;
const cat=id=>S.cats.find(c=>c.id==id),tm=(k=mk)=>S.tx.filter(t=>key(new Date(t.ts))==k),sum=(l,k)=>l.filter(t=>t.t==k).reduce((a,t)=>a+t.amt,0);
const uses=()=>{const u={};S.tx.forEach(t=>u[t.cat]=(u[t.cat]||0)+1);return[...S.cats].sort((a,b)=>(u[b.id]||0)-(u[a.id]||0))};
const DN=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const dn=ts=>{const d=new Date(ts);return DN[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)};
const hm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const loc=ts=>new Date(ts-new Date(ts).getTimezoneOffset()*6e4).toISOString().slice(0,16);

const calc=s=>{if(!s)return 0;const m=String(s).replace(/[^0-9+-]/g,'').match(/[+-]?\d+/g);return m?Math.max(0,m.reduce((a,b)=>a+ +b,0)):0};

const pBal=k=>{const pk=pmk(k),l=tm(pk);return(S.cap[pk]||0)+sum(l,'in')-sum(l,'out')};
const unFix=(k=mk)=>{const l=tm(k);return S.fix.filter(x=>!l.some(t=>t.fid==x.id))};

const row=t=>{const c=cat(t.cat);return `<button class=r data-a=ed data-v=${t.id}><span>${t.t=='in'?'Nạp thêm':E(c?c.name:'Khác')}${t.fid?'<i class=tag>Cố định</i>':''}<small>${E(t.note||'')}${t.note?' – ':''}${hm(t.ts)}</small></span><span class="${t.t=='in'?'pl':''}">${t.t=='in'?'+':'−'}${f(t.amt)}</span></button>`};
const grp=l=>{let d='',h='';[...l].sort((a,b)=>b.ts-a.ts).forEach(t=>{const n=dn(t.ts);if(n!=d){d=n;h+=`<div class=day>${n}</div>`}h+=row(t)});return h||'<p class=lb>Chưa có khoản nào. Bấm nút + để ghi khoản đầu tiên.</p>'};
const ftx=()=>tm().filter(t=>{const c=cat(t.cat);return((t.note||'')+' '+(c?c.name:'')).toLowerCase().includes(q.toLowerCase())});
const hl=()=>{const l=ftx(),o=sum(l,'out'),i=sum(l,'in');return(q.trim()?`<div class=sub><span>Kết quả: ${l.length} khoản</span><span>Chi: ${f(o)} đ${i?' | Nạp: '+f(i)+' đ':''}</span></div>`:'')+grp(l)};
const head=()=>{const[y,m]=mk.split('-');return `<div class=hd><button data-a=mo data-v=-1>‹</button><h1>Tháng ${+m}, ${y}</h1><button data-a=mo data-v=1>›</button></div>`};

const V={
home(){
  const l=tm(),o=sum(l,'out'),i=sum(l,'in'),c=S.cap[mk]||0,bal=c+i-o,n=new Date(),dl=new Date(n.getFullYear(),n.getMonth()+1,0).getDate()-n.getDate()+1,tot=c+i;
  const uf=unFix(mk),ufSum=uf.reduce((a,x)=>a+x.amt,0),freeBal=bal-ufSum;
  const bAlert=S.ops>=10?`<div class=bkb><span>Đã có ${S.ops} thay đổi chưa sao lưu</span><button class=lk data-a=ex>Tải JSON ngay</button></div>`:'';
  return head()+bAlert+`<div class=lb>Số dư còn lại</div><div class="big ${bal<0?'neg':''}">${f(bal)}<small> đ</small></div>
  <div class=stats>
    <div class=st><span>Vốn đầu tháng</span><button class=lk data-a=cap><strong>${c?f(c)+' đ':'Nhập vốn'}</strong></button></div>
    <div class=st><span>Nạp thêm</span><strong>+${f(i)} đ</strong></div>
    <div class=st><span>Đã chi</span><strong>−${f(o)} đ</strong></div>
  </div>
  <div class=bar><i style="width:${tot>0?Math.min(100,o/tot*100):0}%;${o>tot?'background:var(--wr)':''}"></i></div>
  ${mk==key(n)&&(c||i)?`<div class=lb>Có thể chi mỗi ngày: <strong>${f(Math.max(0,freeBal/dl))} đ</strong>${ufSum?` <small>(đã trừ ${f(ufSum)} đ cố định chờ chi)</small>`:''}</div>`:''}
  ${uf.length?`<div class=kv style="margin-top:8px;border-top:1px dashed var(--ln)"><span class=lb>Còn ${uf.length} khoản cố định (${f(ufSum)} đ)</span><button class=lk data-a=apf>Ghi nhận tất cả</button></div>`:''}
  <div class=sec><span>Gần đây</span>${S.fix.length?`<button class=lk data-a=mfix>Khoản cố định</button>`:''}</div>${grp(l.sort((a,b)=>b.ts-a.ts).slice(0,6))}`
},
cats(){const l=tm(),o=sum(l,'out');return head()+S.cats.map(c=>{const x=l.filter(t=>t.cat==c.id&&t.t=='out');return{c,s:sum(x,'out'),n:x.length}}).sort((a,b)=>b.s-a.s).map(x=>`<button class=r data-a=cat data-v=${x.c.id}><span><i class=sw style="background:${x.c.color}"></i>${E(x.c.name)}<small>${x.n} khoản</small><span class=bar><i style="width:${o?x.s/o*100:0}%;background:${x.c.color}"></i></span></span><span>${f(x.s)}</span></button>`).join('')+`<button class=lk data-a=nc style="margin-top:20px">Thêm danh mục</button>`},
cd(){const c=cat(arg);if(!c){view='cats';return V.cats()}const l=S.tx.filter(t=>t.cat==c.id&&t.t=='out'&&(all||key(new Date(t.ts))==mk));return `<div class=hd><button data-a=go data-v=cats>‹</button><h1>${E(c.name)}</h1><button class=lk data-a=ec style="font-size:16px">Sửa</button></div><div class=lb>${all?'Tất cả thời gian':'Tháng '+mk.slice(5)+'/'+mk.slice(0,4)}</div><div class=big>${f(sum(l,'out'))}<small> đ</small></div><button class=lk data-a=sc>${all?'Chỉ xem tháng này':'Xem tất cả thời gian'}</button>`+grp(l)},
hist(){return head()+`<input id=sq class=fi placeholder="Tìm theo ghi chú hoặc danh mục" value="${E(q)}"><div id=hl>${hl()}</div>`},
set(){
  const uf=unFix(mk);
  return `<div class=hd><h1>Cài đặt</h1></div>
  <div class=kv><span>Vốn tháng ${mk.slice(5)}/${mk.slice(0,4)}</span><button class=lk data-a=cap>${S.cap[mk]?f(S.cap[mk])+' đ':'Nhập vốn'}</button></div>
  <div class=kv><span>Khoản chi cố định (${S.fix.length})</span><button class=lk data-a=mfix>Quản lý</button></div>
  ${uf.length?`<div class=kv><span>Chưa ghi tháng này: ${uf.length} khoản</span><button class=lk data-a=apf>Ghi nhận ngay</button></div>`:''}
  <div class=sec><span>Dữ liệu</span></div>
  <p class=lb>Dữ liệu chỉ nằm trên trình duyệt này (${S.ops||0} thay đổi từ lần lưu trước). Sao lưu gần nhất: ${S.bk?new Date(S.bk).toLocaleDateString('vi-VN'):'chưa có'}.</p>
  <button class=r data-a=ex><span>Sao lưu (file JSON)</span><span class=lk>Tải về</span></button>
  <button class=r data-a=csv><span>Xuất bảng tính (CSV)</span><span class=lk>Tải về</span></button>
  <button class=r data-a=im><span>Khôi phục / Gộp từ file JSON</span><span class=lk>Chọn file</span></button>
  <input type=file id=fl accept=".json,application/json" hidden>`
}};

function render(){$('#v').innerHTML=V[view]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(view=='cd'?'cats':view)));scrollTo(0,0)}
const sheet=h=>{$('#sh').innerHTML='<div class=bk data-a=close></div><div class=pn>'+h+'</div>';$('#sh').hidden=false};
function toast(m,u){const t=$('#tt');t.innerHTML=`<span>${E(m)}</span>`+(u?'<button data-a=undo>Hoàn tác</button>':'');t.hidden=false;clearTimeout(tmr);tmr=setTimeout(()=>t.hidden=true,5000)}
function form(t,c){fm=t?{...t,a:String(t.amt)}:{t:'out',a:'',cat:c||uses()[0].id,note:'',ts:Date.now()};draw()}
function upAmt(){const hasOp=/[+-]/.test(fm.a.slice(1));$('#ex').textContent=hasOp?fm.a.replace(/([+-])/g,' $1 ')+' =':'';$('#ad').textContent=f(calc(fm.a))+' đ'}
function draw(){
  const out=fm.t=='out',hasOp=/[+-]/.test(fm.a.slice(1));
  sheet(`<div class=tabs><button data-a=ft data-v=out class="${out?'on':''}">Chi tiêu</button><button data-a=ft data-v=in class="${out?'':'on'}">Nạp thêm</button></div>
  <div class=amt-box><div class=expr id=ex>${hasOp?E(fm.a.replace(/([+-])/g,' $1 '))+' =':''}</div><div class="big amt" id=ad>${f(calc(fm.a))} đ</div></div>
  ${out?`<div class=chips>${uses().map(c=>`<button data-a=fc data-v=${c.id} class="${c.id==fm.cat?'on':''}">${E(c.name)}</button>`).join('')}</div>`:''}
  <div class=kp>${['1','2','3','+','4','5','6','-','7','8','9','000','0','<','='].map(k=>`<button data-a=k data-v="${k}" class="${'+-='.includes(k)?'op':''}" style="${k=='0'?'grid-column:span 2':''}">${k=='<'?'Xoá':k}</button>`).join('')}</div>
  <div class=row2><input id=nt class=fi placeholder="Ghi chú (tuỳ chọn)" value="${E(fm.note)}"><input id=dt class="fi dt" type=datetime-local value="${loc(fm.ts)}"></div>
  <button class=pri data-a=fs>${fm.id?'Cập nhật':out?'Lưu khoản chi':'Lưu khoản nạp'}</button>
  ${fm.id?'<button class="pri alt" data-a=del>Xoá khoản này</button>':''}`)
}
const dl=(n,x,ty)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:ty}));a.download=n;a.click()};
const nid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

const A={
go:v=>{view=v;render()},
mo:v=>{const[y,m]=mk.split('-');mk=key(new Date(+y,+m-1+ +v,1));render()},
cat:v=>{view='cd';arg=v;all=false;render()},
sc:()=>{all=!all;render()},
add:()=>form(null,view=='cd'?arg:null),
ed:v=>form(S.tx.find(t=>t.id==v)),
close:()=>{$('#sh').hidden=true},
ft:v=>{fm.t=v;draw()},
fc:v=>{fm.cat=v;draw()},
k:v=>{
  let a=String(fm.a||'');
  if(v=='<')a=a.slice(0,-1);
  else if(v=='=')a=String(calc(a)||'');
  else if(v=='+'||v=='-'){if(a&&!/[+-]$/.test(a))a+=v;else if(/[+-]$/.test(a))a=a.slice(0,-1)+v}
  else if(a.length<18){const pts=a.split(/[+-]/),cur=pts[pts.length-1];if(cur.length<10)a=(a+v).replace(/^0+(?=\d)/,'').replace(/([+-])0+(?=\d)/g,'$1')}
  fm.a=a;upAmt()
},
fs:()=>{
  const a=calc(fm.a);if(!a)return toast('Nhập số tiền trước');
  const o={id:fm.id||nid(),t:fm.t,amt:a,cat:fm.cat,note:fm.note.trim(),ts:fm.ts,fid:fm.fid};
  S.tx=S.tx.filter(t=>t.id!=o.id);S.tx.push(o);mk=key(new Date(o.ts));save();A.close();render();toast('Đã lưu')
},
del:()=>{last=S.tx.find(t=>t.id==fm.id);S.tx=S.tx.filter(t=>t.id!=fm.id);save();A.close();render();toast('Đã xoá khoản',1)},
undo:()=>{if(last){S.tx.push(last);last=null;save();render();$('#tt').hidden=true}},
cap:()=>{
  const pb=pBal(mk),pk=pmk(mk);
  sheet(`<h2>Vốn tháng ${mk.slice(5)}/${mk.slice(0,4)}</h2>
  <input id=cp class=fi inputmode=numeric placeholder="Số tiền (đ)" value="${S.cap[mk]||''}">
  ${pb!==0?`<div class=kv style="margin-bottom:8px"><span class=lb>Dư tháng ${pk.slice(5)}/${pk.slice(0,4)}: <strong>${pb>0?'+':''}${f(pb)} đ</strong></span><button class=lk data-a=roll data-v=${pb}>Cộng dồn vào vốn</button></div>`:''}
  <button class=pri data-a=cs>Lưu vốn</button>`);$('#cp').focus()
},
roll:v=>{const el=$('#cp'),cur=+(el.value.replace(/\D/g,''))||0;el.value=Math.max(0,cur+ +v)},
cs:()=>{S.cap[mk]=+($('#cp').value.replace(/\D/g,''))||0;save();A.close();render()},
mfix:()=>{
  const uf=unFix(mk);
  sheet(`<h2>Khoản chi cố định hàng tháng</h2>
  <p class=lb style="margin-top:0">Tự động trừ trước khi tính hạn mức chi mỗi ngày để tránh ảo tưởng số dư.</p>
  ${S.fix.map(x=>{const c=cat(x.cat);return `<div class=r><span>${E(x.note||c?.name||'Cố định')}<small>${E(c?.name||'Khác')} – ${f(x.amt)} đ</small></span><button class=lk style="color:var(--wr)" data-a=dfix data-v=${x.id}>Xoá</button></div>`}).join('')||'<p class=lb>Chưa có khoản cố định nào.</p>'}
  <div class=sec style="margin-top:18px;font-size:17px">Thêm khoản cố định mới</div>
  <div class=row2><input id=fn class=fi placeholder="Tên (VD: Tiền trọ)"><input id=fa class=fi inputmode=numeric placeholder="Số tiền (đ)"></div>
  <div class=chips id=fc_fix>${S.cats.map((c,i)=>`<button data-a=sfixc data-v=${c.id} class="${i==0?'on':''}">${E(c.name)}</button>`).join('')}</div>
  <button class=pri data-a=afix>Thêm vào danh sách cố định</button>
  ${uf.length?`<button class="pri alt" style="color:var(--ac);border-color:var(--ac)" data-a=apf>Ghi nhận ${uf.length} khoản vào tháng ${mk.slice(5)}</button>`:''}`)
},
sfixc:v=>{document.querySelectorAll('#fc_fix button').forEach(b=>b.classList.toggle('on',b.dataset.v==v))},
afix:()=>{
  const note=$('#fn').value.trim(),amt=+($('#fa').value.replace(/\D/g,''))||0,cb=$('#fc_fix .on'),cid=cb?cb.dataset.v:S.cats[0].id;
  if(!amt)return toast('Nhập số tiền cố định');
  S.fix.push({id:nid(),note:note||(cat(cid)?.name||'Chi cố định'),amt,cat:cid});save();A.mfix()
},
dfix:v=>{S.fix=S.fix.filter(x=>x.id!=v);save();A.mfix()},
apf:()=>{
  const uf=unFix(mk);if(!uf.length)return toast('Đã ghi nhận đủ trong tháng này');
  const[y,m]=mk.split('-'),now=new Date(),ts=(mk==key(now))?Date.now():new Date(+y,+m-1,1,9,0).getTime();
  uf.forEach((x,i)=>S.tx.push({id:nid(),t:'out',amt:x.amt,cat:x.cat,note:x.note,ts:ts+i,fid:x.id}));
  save();A.close();render();toast(`Đã ghi nhận ${uf.length} khoản cố định`)
},
nc:()=>{sheet(`<h2>Danh mục mới</h2><input id=cn class=fi placeholder="Tên danh mục"><button class=pri data-a=ncs>Thêm</button>`);$('#cn').focus()},
ncs:()=>{const n=$('#cn').value.trim();if(!n)return;S.cats.push({id:nid(),name:n,color:PAL[S.cats.length%PAL.length]});save();A.close();render()},
ec:()=>{const c=cat(arg);sheet(`<h2>Sửa danh mục</h2><input id=cn class=fi value="${E(c.name)}"><button class=pri data-a=ecs>Lưu tên</button><button class="pri alt" data-a=dc>Xoá danh mục</button>`)},
ecs:()=>{const n=$('#cn').value.trim();if(n){cat(arg).name=n;save()}A.close();render()},
dc:()=>{const n=S.tx.filter(t=>t.cat==arg).length;if(!confirm(n?`${n} khoản sẽ chuyển sang "Khác". Xoá danh mục?`:'Xoá danh mục này?'))return;let o=S.cats.find(c=>c.name=='Khác'&&c.id!=arg);if(!o&&n){o={id:nid(),name:'Khác',color:PAL[5]};S.cats.push(o)}S.tx.forEach(t=>{if(t.cat==arg)t.cat=o.id});S.cats=S.cats.filter(c=>c.id!=arg);save();A.close();view='cats';render()},
ex:()=>{S.bk=Date.now();S.ops=0;save(0);dl('chi-tieu-'+key(new Date())+'.json',JSON.stringify(S),'application/json');render()},
csv:()=>dl('chi-tieu.csv','\ufeffngày,loại,số tiền,danh mục,ghi chú\n'+[...S.tx].sort((a,b)=>a.ts-b.ts).map(t=>[loc(t.ts).replace('T',' '),t.t=='in'?'nạp':'chi',t.amt,(cat(t.cat)||{}).name||'',(t.note||'').replace(/"/g,'""')].map(x=>`"${x}"`).join(',')).join('\n'),'text/csv'),
im:()=>$('#fl').click(),
imo:()=>{if(!pend)return;S=pend;S.cap=S.cap||{};S.fix=S.fix||[];S.ops=0;pend=null;save(0);A.close();render();toast('Đã ghi đè dữ liệu')},
imm:()=>{
  if(!pend)return;
  const cMap={};
  (pend.cats||[]).forEach(pc=>{
    let ex=S.cats.find(c=>c.id==pc.id||c.name.toLowerCase()==pc.name.toLowerCase());
    if(!ex){ex={...pc,id:S.cats.some(c=>c.id==pc.id)?nid():pc.id};S.cats.push(ex)}
    cMap[pc.id]=ex.id
  });
  const ids=new Set(S.tx.map(t=>t.id));let added=0;
  (pend.tx||[]).forEach(pt=>{if(!ids.has(pt.id)){S.tx.push({...pt,cat:cMap[pt.cat]||pt.cat});added++}});
  Object.assign(S.cap,pend.cap||{});
  const fIds=new Set(S.fix.map(x=>x.id));
  (pend.fix||[]).forEach(pf=>{if(!fIds.has(pf.id))S.fix.push({...pf,cat:cMap[pf.cat]||pf.cat})});
  pend=null;save();A.close();render();toast(`Đã gộp thêm ${added} giao dịch mới`)
}};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='nt')fm.note=e.target.value;if(i=='dt')fm.ts=new Date(e.target.value).getTime()||fm.ts;if(i=='sq'){q=e.target.value;$('#hl').innerHTML=hl()}});
document.addEventListener('change',e=>{
  if(e.target.id!='fl'||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!Array.isArray(d.cats)||!Array.isArray(d.tx))throw 0;
      pend=d;
      sheet(`<h2>Khôi phục dữ liệu</h2>
      <p class=lb>File chứa <strong>${d.tx.length}</strong> giao dịch và <strong>${d.cats.length}</strong> danh mục. Chọn cách xử lý:</p>
      <button class=pri data-a=imm>Gộp dữ liệu (Giữ lại khoản cũ, thêm khoản mới)</button>
      <button class="pri alt" data-a=imo>Ghi đè toàn bộ (Xoá sạch dữ liệu hiện tại)</button>`)
    }catch(x){toast('File không hợp lệ')}
    e.target.value=''
  };
  r.readAsText(e.target.files[0])
});
render();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script></body></html>
